spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000
      max-lifetime: 240000
      idle-timeout: 120000

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /jobTracking
  forward-headers-strategy: framework

  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 200
    accept-count: 50

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:https://job-tracking-application-frontend.vercel.app}

app:
  email:
    provider: ${EMAIL_PROVIDER:gmail}
    from-name: ${EMAIL_FROM_NAME:JobJuggler}
    from-address: ${EMAIL_FROM_ADDRESS:jobjugglerio@gmail.com}
    reply-to: ${EMAIL_REPLY_TO:jobjugglerio@gmail.com}
    brevo:
      api-key: ${BREVO_API_KEY:}
    gmail:
      client-id: ${GMAIL_OAUTH_CLIENT_ID:}
      client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
      refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:https://job-tracking-application-frontend.vercel.app/oauth2/redirect}
  password-reset:
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:https://job-tracking-application-frontend.vercel.app/reset-password}
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    max-overdue-days: ${REMINDERS_MAX_OVERDUE_DAYS:7}
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    root: INFO
    com.jobtracker: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
