spring:
  config:
    import: optional:file:./local-secrets.properties

  datasource:
    url: jdbc:mysql://localhost:3306/jobtracking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:placeholder}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true

server:
  port: 8080
  servlet:
    context-path: /jobTracking

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app:
  email:
    provider: ${EMAIL_PROVIDER:log}
    from-name: ${EMAIL_FROM_NAME:JobJuggler}
    from-address: ${EMAIL_FROM_ADDRESS:jobjugglerio@gmail.com}
    reply-to: ${EMAIL_REPLY_TO:jobjugglerio@gmail.com}
    brevo:
      api-key: ${BREVO_API_KEY:}
    gmail:
      client-id: ${GMAIL_OAUTH_CLIENT_ID:}
      client-secret: ${GMAIL_OAUTH_CLIENT_SECRET:}
      refresh-token: ${GMAIL_OAUTH_REFRESH_TOKEN:}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  password-reset:
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/reset-password}
    token-expiration-minutes: 30
    resend-cooldown-minutes: 2
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    cron: ${REMINDERS_CRON:0 0 * * * *}
    batch-size: 50
    max-overdue-days: ${REMINDERS_MAX_OVERDUE_DAYS:7}
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    cron: ${CLEANUP_CRON:0 30 3 * * *}

jwt:
  secret: ${JWT_SECRET:changeme}
  expiration: 900000
  refresh-expiration: 604800000
  refresh-absolute-expiration: 2592000000
  refresh-rotation-grace-seconds: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

gemini:
  api-key: ${GEMINI_API_KEY:placeholder}