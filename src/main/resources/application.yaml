spring:
  config:
    import: optional:file:./local-secrets.properties

  datasource:
    url: jdbc:mysql://localhost:3306/jobtracking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:placeholder}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email

  servlet:
    multipart:
      # Outer guard only — the real per-purpose caps (5 MB docs / 2 MB avatars) are enforced in
      # FilePurpose. This just stops the container buffering something enormous first.
      max-file-size: 6MB
      max-request-size: 8MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:placeholder}
    password: ${GMAIL_APP_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /jobTracking

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  password-reset:
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/reset-password}
    token-expiration-minutes: 30
    # Per-account cooldown between reset emails. Applied silently — surfacing it as an error
    # would tell an attacker the address is registered.
    resend-cooldown-minutes: 2
  reminders:
    # Set REMINDERS_ENABLED=false to stop the scheduler sending real email in dev.
    enabled: ${REMINDERS_ENABLED:true}
    # 6-field Spring cron (sec min hour dom mon dow). Default: top of every hour.
    cron: ${REMINDERS_CRON:0 0 * * * *}
    batch-size: 50
    # Backfill guard: follow-ups older than this are skipped permanently rather than emailed.
    # Stops the first run after enabling (or after downtime) blasting a stale backlog.
    max-overdue-days: ${REMINDERS_MAX_OVERDUE_DAYS:7}
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    # Daily at 03:30.
    cron: ${CLEANUP_CRON:0 30 3 * * *}

jwt:
  secret: ${JWT_SECRET:changeme}
  expiration: 900000
  refresh-expiration: 604800000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

gemini:
  api-key: ${GEMINI_API_KEY:placeholder}