spring:
  config:
    import: optional:file:./local-secrets.properties

  datasource:
    url: jdbc:mysql://localhost:3306/jobtracking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:placeholder}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    # The database already exists and was built by ddl-auto, so there is no migration history.
    # baseline-on-migrate stamps it as V1 (without running V1) and then applies V2 onward.
    # A brand-new database instead runs V1 from scratch.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema now. `validate` makes Hibernate verify the entities match what
      # the migrations produced and fail fast if they don't — instead of silently "fixing" it,
      # which is what produced the drift this replaces.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
            scope: user:email

  servlet:
    multipart:
      # Outer guard only — the real per-purpose caps (5 MB docs / 2 MB avatars) are enforced in
      # FilePurpose. This just stops the container buffering something enormous first.
      max-file-size: 6MB
      max-request-size: 8MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER:placeholder}
    password: ${GMAIL_APP_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        # ONLY health. The default exposure includes endpoints like `env` and `beans`, which
        # would hand configuration values and internal wiring to anyone who can reach the port.
        include: health
  endpoint:
    health:
      # "UP"/"DOWN" and nothing else. The detailed view names the database, its vendor and
      # validation state — more than an unauthenticated prober has any need for.
      show-details: never

server:
  port: 8080
  servlet:
    context-path: /jobTracking

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}
  password-reset:
    redirect-uri: ${PASSWORD_RESET_REDIRECT_URI:http://localhost:5173/reset-password}
    token-expiration-minutes: 30
    # Per-account cooldown between reset emails. Applied silently — surfacing it as an error
    # would tell an attacker the address is registered.
    resend-cooldown-minutes: 2
  reminders:
    # Set REMINDERS_ENABLED=false to stop the scheduler sending real email in dev.
    enabled: ${REMINDERS_ENABLED:true}
    # 6-field Spring cron (sec min hour dom mon dow). Default: top of every hour.
    cron: ${REMINDERS_CRON:0 0 * * * *}
    batch-size: 50
    # Backfill guard: follow-ups older than this are skipped permanently rather than emailed.
    # Stops the first run after enabling (or after downtime) blasting a stale backlog.
    max-overdue-days: ${REMINDERS_MAX_OVERDUE_DAYS:7}
  cleanup:
    enabled: ${CLEANUP_ENABLED:true}
    # Daily at 03:30.
    cron: ${CLEANUP_CRON:0 30 3 * * *}

jwt:
  secret: ${JWT_SECRET:changeme}
  expiration: 900000
  # Sliding window: each rotation issues a fresh 7 days.
  refresh-expiration: 604800000
  # Absolute ceiling from the ORIGINAL login (30 days), so sliding expiry can't
  # produce an immortal session. Reaching it revokes the family and forces re-login.
  refresh-absolute-expiration: 2592000000
  # A token replayed within this many seconds of being rotated is treated as two
  # tabs racing, not theft — it fails that call without revoking the session.
  refresh-rotation-grace-seconds: 30

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

gemini:
  api-key: ${GEMINI_API_KEY:placeholder}